<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>報名表單設計器｜EventFlow V3.0</title><link rel="stylesheet" href="/design.css"><link rel="stylesheet" href="/form-builder.css"></head><body><header class="builder-header"><a href="/admin.html">✦ EventFlow <small>表單工作室</small></a><div><button id="builderBack" class="secondary">返回活動</button><button id="saveForm">儲存活動表單</button></div></header><main><section class="builder-title"><div><span class="eyebrow">FORM STUDIO / V3.0</span><h1>讓每一個問題，都更好填寫。</h1><p>中央就是報名者會看到的完整表單。系統必要欄位固定保留，額外欄位可自由排序。</p></div><label>編輯活動<select id="builderEvent"><option value="">請選擇活動</option></select></label></section><p id="builderMessage" role="status" aria-live="polite"></p><div class="builder-layout"><aside class="builder-pane"><h2>欄位元件</h2><div id="components" class="component-list"></div><hr><h2>表單範本</h2><label>選擇範本<select id="templateSelect"><option value="">正在載入…</option></select></label><button id="applyTemplate" class="secondary wide">套用範本</button><label>另存範本名稱<input id="templateName" maxlength="100" placeholder="例如：團隊工作坊"></label><button id="saveTemplate" class="secondary wide">儲存自訂範本</button><p class="builder-note">套用只改變目前編輯內容，儲存活動後才套用到報名頁。已有報名的欄位快照不會被覆寫。</p></aside><section class="builder-canvas"><div class="preview-toolbar"><div><button id="desktopPreview" class="secondary active">桌面</button><button id="mobilePreview" class="secondary">手機</button></div><label class="check-label"><input type="checkbox" id="testMode"> 測試填寫</label></div><div class="paper" id="formPaper"><div class="paper-head"><span class="eyebrow">REGISTRATION PREVIEW</span><h2 id="previewTitle">活動報名表</h2><p>請填寫以下資訊。此為預覽，測試填寫不會建立報名紀錄。</p></div><form id="previewForm" novalidate></form></div><p id="testResult" role="status"></p></section><aside class="builder-pane properties"><h2>欄位設定</h2><p id="selectionHint">選取中央的欄位，調整標籤、提示與規則。</p><form id="propertyForm" hidden><input type="hidden" name="id"><label>欄位名稱<input name="label" maxlength="100" required></label><label class="check-label"><input type="checkbox" name="required"> 必填欄位</label><label>提示文字<textarea name="hint" maxlength="500" rows="3"></textarea></label><label>輸入提示<input name="placeholder" maxlength="200"></label><label id="optionsLabel">選項（每行一個）<textarea name="options" maxlength="5000" rows="5"></textarea></label><label>預設值<input name="defaultValue" maxlength="500" placeholder="多選以逗號分隔；同意欄填 true／false"></label><div class="property-grid"><label>最小值<input name="min" type="number" step="any"></label><label>最大值<input name="max" type="number" step="any"></label><label>最短字數<input name="minLength" type="number" min="0" max="500"></label><label>最長字數<input name="maxLength" type="number" min="0" max="500"></label></div><button>套用欄位設定</button><div class="property-actions"><button id="moveUp" type="button" class="secondary">↑ 上移</button><button id="moveDown" type="button" class="secondary">↓ 下移</button><button id="removeField" type="button" class="secondary danger">刪除此欄位</button></div><p id="systemNote" class="builder-note" hidden>系統欄位的名稱與必填規則固定，不能刪除。可調整提示及預設值。</p></form></aside></div></main><script src="/form-builder.js" defer></script></body></html>
