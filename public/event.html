<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>活動詳情｜EventFlow V2.9</title><link rel="stylesheet" href="/design.css"><link rel="stylesheet" href="/discovery.css"><link rel="stylesheet" href="/v29.css"></head><body class="discovery-page flow-page" data-page="event"><header class="market-nav"><a class="market-brand" href="/"><img id="brandLogo" class="brand-logo" alt="" hidden>✦ <b id="brandName">EventFlow</b></a><nav><a href="/">探索活動</a><a href="/#lookup">報名查詢</a></nav></header><main class="flow-wrap"><a class="back-link" href="/">← 返回活動探索</a><p id="eventLoading" role="status" class="state-panel">正在載入活動資訊…</p><p id="eventError" role="alert"></p><div id="eventContent" hidden><ol class="flow-steps" aria-label="報名進度"><li data-step="1" class="active">01 確認活動</li><li data-step="2">02 填寫資料</li><li data-step="3">03 確認送出</li><li data-step="4">04 報名結果</li></ol><section id="eventIntro" class="event-layout"><div><div id="detailCover" class="event-cover"></div><article class="flow-card event-story"><p id="detailCategory" class="eyebrow"></p><h1 id="detailTitle" tabindex="-1"></h1><p class="subtle">主辦單位 · <span id="organizerName"></span></p><h2>關於這場活動</h2><p id="detailDescription" class="preserve-lines"></p></article></div><aside class="flow-card booking-summary"><span class="eyebrow">YOUR NEXT EXPERIENCE</span><h2>留一個位置給自己</h2><dl id="detailFacts" class="facts-grid"></dl><p id="capacityNote" class="section-note"></p><button id="applyNow" class="primary wide">立即報名</button><button id="shareEvent" class="secondary wide">複製活動網址 ↗</button><p id="eventMessage" role="status"></p></aside></section><section id="registrationFormPanel" class="flow-card form-stage" hidden><span class="eyebrow">YOUR DETAILS</span><h1 id="formHeading" tabindex="-1">填寫報名資料</h1><p id="remainingHint" class="section-note"></p><form id="regForm"><div class="reg-grid"><label>姓名（必填）<input name="name" maxlength="60" required autocomplete="name"></label><label>手機（必填）<input name="phone" required inputmode="tel" autocomplete="tel" pattern="09[0-9]{8}" placeholder="09xxxxxxxx"></label></div><label>Email（必填）<input name="email" type="email" required autocomplete="email"></label><label>報名人數（必填）<input name="participants" type="number" min="1" step="1" value="1" required></label><div id="extra"></div><label>備註（選填）<textarea name="notes" maxlength="1000" rows="3"></textarea></label><div class="action-row"><button type="button" id="backToActivity" class="secondary">返回活動</button><button id="submitReg">下一步：確認資料 →</button></div></form><p id="formMessage" role="alert"></p></section><section id="reviewPanel" class="flow-card form-stage" hidden><span class="eyebrow">ONE LAST LOOK</span><h1 id="reviewHeading" tabindex="-1">確認報名內容</h1><dl id="reviewSummary" class="facts-grid"></dl><p id="reviewNote" class="notice"></p><div class="action-row"><button id="editRegistration" class="secondary">返回修改</button><button id="confirmSubmit">確認送出報名 →</button></div><p id="submitStatus" role="status" aria-live="polite"></p></section></div><button id="mobileApply" class="mobile-apply" hidden>立即報名</button></main><footer class="market-footer"><b>✦ EventFlow</b><span>為每一次相遇，創造更好的開始。</span><small>V2.9 · <a href="/image-credits.html">圖片來源</a></small></footer><script src="/ticket.js" defer></script><script src="/discovery.js" defer></script></body></html>
